name: Tests (e2e)
on:
  pull_request:
    branches: [develop, 'feature/**', 'imap-support*', 'richard-develop']
  push:
    branches: [develop, 'feature/**', 'imap-support*', 'richard-develop']
jobs:
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build the UI and Mailpit binary
        run: |
          npm run package
          go build -o mailpit .
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        # Upload to this Gitea instance using its artifact service.
        uses: https://github.com/christopherhx/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
